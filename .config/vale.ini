StylesPath = vale
MinAlertLevel = warning
Vocab = Assay

[*.md]
BasedOnStyles = Vale, Google

# Every enabled rule is an error, so any alert blocks a commit.

# Enabled
Google.AMPM = error
Google.Colons = error
Google.DateFormat = error
Google.Ellipses = error
Google.EmDash = error
Google.Exclamation = error
Google.HeadingPunctuation = error
Google.Headings = error
Google.LyHyphens = error
Google.OptionalPlurals = error
Google.Ordinal = error
Google.OxfordComma = error
Google.Passive = error
Google.Periods = error
Google.Ranges = error
Google.Slang = error
Google.Spacing = error
Google.Spelling = error

# Disabled
Google.Acronyms = NO
Google.Anthropomorphism = NO
Google.Contractions = NO
Google.ExcessiveClaims = NO
Google.FirstPerson = NO
Google.Gender = NO
Google.GenderBias = NO
Google.Jargon = NO
Google.Latin = NO
Google.Parens = NO
Google.Quotes = NO
Google.Semicolons = NO
Google.Timeless = NO
Google.Units = NO
Google.We = NO
Google.Will = NO
Google.WordList = NO
Google.WordListCase = NO
